name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble

    env:
      HOME: /root
      CI: true

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint & Format
        id: lint
        run: npm run lint

      - name: Run Playwright E2E Tests (Logic)
        id: e2e
        if: success() || failure()
        # Runs everything EXCEPT tests with "Visual Regression" in the title
        run: npx playwright test --grep-invert "Visual Regression"

      - name: Run Playwright Visual Regression
        id: visual
        if: success() || failure()
        # Runs ONLY the visual regression suite
        run: npx playwright test --grep "Visual Regression"

      - name: Upload Playwright report
        if: (success() || failure()) && !env.ACT && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Include 'test-results' to see actual vs. expected vs. diff images
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Generate Summary
        if: always()
        shell: bash
        run: |
          # Helper function for status icons
          get_icon() {
            if [[ "$1" == "success" ]]; then echo "✅ Pass";
            elif [[ "$1" == "skipped" ]]; then echo "⏭️ Skipped";
            else echo "❌ Fail"; fi
          }

          LINT_STATUS=$(get_icon "${{ steps.lint.outcome }}")
          E2E_STATUS=$(get_icon "${{ steps.e2e.outcome }}")
          VISUAL_STATUS=$(get_icon "${{ steps.visual.outcome }}")

          echo "### 🚀 Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧹 Linting & Format | $LINT_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎭 Playwright E2E (Logic) | $E2E_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| 📸 Visual Regression | $VISUAL_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the **playwright-report** artifact to inspect visual diffs." >> $GITHUB_STEP_SUMMARY
