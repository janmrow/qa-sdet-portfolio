name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble

    env:
      HOME: /root
      CI: true

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint & Format
        id: lint
        run: npm run lint

      - name: Run Playwright E2E Tests
        id: e2e
        if: success() || failure()
        run: npm run test:e2e

      - name: Upload Playwright report
        if: (success() || failure()) && !env.ACT && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Generate Summary
        if: always()
        shell: bash
        run: |
          LINT_OUTCOME="${{ steps.lint.outcome }}"
          E2E_OUTCOME="${{ steps.e2e.outcome }}"

          if [[ "$LINT_OUTCOME" == "success" ]]; then
            LINT_STATUS="✅ Pass"
          elif [[ "$LINT_OUTCOME" == "skipped" ]]; then
            LINT_STATUS="⏭️ Skipped"
          else
            LINT_STATUS="❌ Fail"
          fi

          if [[ "$E2E_OUTCOME" == "success" ]]; then
            E2E_STATUS="✅ Pass"
          elif [[ "$E2E_OUTCOME" == "skipped" ]]; then
            E2E_STATUS="⏭️ Skipped"
          else
            E2E_STATUS="❌ Fail"
          fi

          echo "### 🚀 Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧹 Linting & Format | $LINT_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎭 Playwright E2E | $E2E_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the artifacts for the full Playwright HTML report." >> $GITHUB_STEP_SUMMARY
